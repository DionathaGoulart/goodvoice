name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # The client targets Windows only; building anywhere else proves nothing.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # webrtc-audio-processing builds its bundled C++ with meson and ninja
      # (DR-11); neither is on the runner's PATH. Both ship as wheels, and the
      # image already has Python.
      - run: pip install meson ninja
      # bindgen wants libclang, and the vendored build script's symbol
      # prefixing wants llvm-nm (DR-24). The runner ships LLVM and does not
      # say where.
      - name: Point the build at the runner's LLVM
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      # meson chooses its toolchain by looking at PATH, and windows-latest
      # stocks it with three things that answer before MSVC does: Strawberry
      # Perl's gcc, a MinGW toolchain, and — the subtle one — Git for Windows'
      # `usr\bin\link.exe`, which is coreutils' `link` and not a linker at all.
      # The vendored C++ has to be built by the compiler the Rust side links
      # with: gcc gets as far as abseil's cctz, where MinGW's own
      # `windows.foundation.h` fails to compile against it.
      #
      # This is `C:\Users\<you>\gv\env.ps1` on the development machine, which
      # is why the two agree. An environment does not survive into the next
      # step, so what VsDevCmd set has to cross through GITHUB_ENV.
      - name: Enter the MSVC environment
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          "INCLUDE=$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$env:LIB" >> $env:GITHUB_ENV
          "LIBPATH=$env:LIBPATH" >> $env:GITHUB_ENV
          # Named outright as well as put on PATH: meson honours CC and CXX
          # before it goes looking, so this cannot be lost to PATH order.
          "CC=cl" >> $env:GITHUB_ENV
          "CXX=cl" >> $env:GITHUB_ENV
          # DR-4: the vendored libopus still declares cmake_minimum_required
          # (VERSION 3.1), which CMake 4 refuses without this.
          "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV
          $env:PATH -split ';' |
            Where-Object { $_ -and $_ -notmatch 'Strawberry|mingw|Git\\usr\\bin' } >> $env:GITHUB_PATH
      # The C++ tree is 440 objects and builds once; the cache is what keeps
      # every later run from paying for it again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      # `--all`/`--workspace`: the harnesses are their own package now (DR-29),
      # and a gate that stops at the tauri crate would stop checking eleven
      # measurement tools and the six tests inside `bin/soak`.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # No credentials needed: a dry run only bundles and validates config.
      - run: npx wrangler deploy --dry-run
