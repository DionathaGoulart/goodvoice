name: release

# The tag is the trigger so that the file on the release page is one CI built
# from the commit the tag names, rather than one a development machine built
# and somebody uploaded. That is the whole of task 6.4's "CI built it".
on:
  push:
    tags: ["v*"]

# `gh release create` writes to the repository.
permissions:
  contents: write

jobs:
  bundle:
    # NSIS, MSI and WebView2 are Windows. There is no cross-build of this.
    runs-on: windows-latest
    env:
      # Same reason as ci.yml: MAX_PATH, and the vendored C++ spends most of it
      # inside meson's build tree before it reaches an object file.
      CARGO_TARGET_DIR: D:\gv
      # Lifted to the job so the symbol step can ask whether it is set: the
      # `secrets` context is not readable from a step-level `if`.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # Cheap, and it runs before the twenty-minute build rather than after:
      # a release page whose installer says 0.1.0 under a tag that says v0.2.0
      # is a thing a person downloads and cannot tell apart.
      - name: The tag and the manifest have to agree
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content client/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $conf) {
            throw "tag ${{ github.ref_name }} says $tag, tauri.conf.json says $conf"
          }
          "version=$conf" >> $env:GITHUB_OUTPUT
        id: version

      - uses: dtolnay/rust-toolchain@stable
      # webrtc-audio-processing builds its bundled C++ with meson and ninja
      # (DR-11); neither is on the runner's PATH, and both ship as wheels.
      - run: pip install meson ninja

      # Every line of this step is ci.yml's, for ci.yml's reasons: meson picks
      # its toolchain off PATH, and windows-latest stocks it with Strawberry
      # Perl's gcc, a MinGW toolchain and Git's `usr\bin\link.exe`, all of which
      # answer before MSVC does. The vendored C++ has to be built by the
      # compiler the Rust side links with.
      - name: Enter the MSVC environment
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          "INCLUDE=$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$env:LIB" >> $env:GITHUB_ENV
          "LIBPATH=$env:LIBPATH" >> $env:GITHUB_ENV
          "CC=cl" >> $env:GITHUB_ENV
          "CXX=cl" >> $env:GITHUB_ENV
          # DR-4: the vendored libopus still declares cmake_minimum_required
          # (VERSION 3.1), which CMake 4 refuses without this.
          "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV
          $env:PATH -split ';' |
            Where-Object { $_ -and $_ -notmatch 'Strawberry|mingw|Git\\usr\\bin|Tools\\Llvm' } >> $env:GITHUB_PATH

      # After the dev shell, not before (DR-24, DR-30): Visual Studio ships its
      # own clang under `VC\Tools\Llvm`, and whichever libclang answers first is
      # the one bindgen loads.
      - name: Point the build at the runner's LLVM
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) {
            throw "no libclang at $llvm; bindgen would silently find another"
          }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          $llvm >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client

      # `tauri build` turns on `custom-protocol` itself, which is what makes
      # this a client with the frontend embedded rather than one pointed at a
      # Vite dev server that is not running (DR-22). No GOODVOICE_SERVER here:
      # unset is what selects lib.rs's public deploy, and an empty value would
      # be `Some("")` and point the client at nothing.
      - name: Build the bundles
        run: npm run tauri build
        working-directory: client
        env:
          # Where this build reports crashes to, and the only place the value
          # exists — `report::DSN` is an `option_env!`, so a build without this
          # secret produces a client that reports nowhere and needs no opt-out.
          # That is what a fork's CI gets, and it is the right answer for one.
          GOODVOICE_SENTRY_DSN: ${{ secrets.GOODVOICE_SENTRY_DSN }}

      # The PDB is written into the runner and the runner is destroyed. If it
      # is not sent from here, the one file that can turn this build's crashes
      # into function names and line numbers stops existing — and nothing
      # downstream notices, because an unsymbolicated crash still arrives, just
      # as a column of addresses. That is why this step fails the job rather
      # than warning: it is the same family of silent failure the bundle counts
      # below are asserted against.
      #
      # Both the PDB and the exe: Sentry needs the binary to extract the call
      # frame information that gives a correct stack out of an optimised
      # minidump, and `lto = true` with `opt-level = "s"` makes this one very
      # optimised indeed.
      #
      # `deps\` and not `release\`: cargo copies the exe up one level but
      # leaves the PDB where the linker wrote it. Named file by file rather
      # than scanning the directory — `deps` holds a PDB for every dependency
      # in the graph, several hundred of them, and none is this app.
      - name: Send the symbols
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npm install -g @sentry/cli
          $files = @(
            "$env:CARGO_TARGET_DIR\release\deps\goodvoice_client.pdb",
            "$env:CARGO_TARGET_DIR\release\deps\goodvoice_client_lib.pdb",
            "$env:CARGO_TARGET_DIR\release\goodvoice-client.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) {
              throw "$f is missing; a crash from this build would be unreadable"
            }
          }
          # `--include-sources` embeds the source of the frames in the trace.
          # The repository is MIT and public, so it costs nothing here and is
          # the difference between a line number and the line.
          sentry-cli debug-files upload --include-sources $files

      # The bundles, named for the version, and the checksums beside them.
      #
      # The counts are asserted because every way this goes wrong is silent.
      # `targets: "all"` producing one installer instead of both is a release
      # page missing a download, not a failed build — and since the installers
      # learned Portuguese there is a second way: WiX writes **one MSI per
      # culture**, so a `wix.language` that lost an entry ships a release whose
      # Brazilian half is simply not there. The expected MSIs are therefore read
      # out of `tauri.conf.json` rather than counted, and a culture with no file
      # fails with the culture named in it.
      #
      # NSIS is the other shape: `nsis.languages` compiles every language into
      # the *one* exe and asks at install time, so there is nothing to count
      # here and a lost language would not change this step's output at all.
      - name: Collect the bundles and check them
        id: collect
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $out = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Path $out | Out-Null
          $found = Get-ChildItem -Path "$env:CARGO_TARGET_DIR\release\bundle" -Recurse `
            -Include *-setup.exe, *.msi
          foreach ($f in $found) { Copy-Item $f.FullName -Destination $out }
          $nsis = Get-ChildItem $out -Filter *-setup.exe
          $msi  = Get-ChildItem $out -Filter *.msi
          if (-not $nsis) { throw "no NSIS installer under $env:CARGO_TARGET_DIR\release\bundle" }
          if (-not $msi)  { throw "no MSI under $env:CARGO_TARGET_DIR\release\bundle" }

          $conf = Get-Content client/src-tauri/tauri.conf.json | ConvertFrom-Json
          $cultures = @($conf.bundle.windows.wix.language)
          foreach ($culture in $cultures) {
            if (-not ($msi | Where-Object { $_.Name -match "_$([regex]::Escape($culture))\.msi$" })) {
              throw "tauri.conf.json asks for the $culture MSI and the bundle has none"
            }
          }
          if ($msi.Count -ne $cultures.Count) {
            throw "$($msi.Count) MSIs for $($cultures.Count) cultures: $($msi.Name -join ', ')"
          }

          foreach ($f in @($nsis) + @($msi)) {
            if ($f.Name -notmatch [regex]::Escape($v)) {
              throw "$($f.Name) does not carry version $v"
            }
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name |
              Out-File -Append -Encoding ascii "$out\SHA256SUMS.txt"
          }
          Get-Content "$out\SHA256SUMS.txt"

      # Kept whether or not the release step runs, so a tag pushed with the
      # release notes not yet written still leaves a downloadable build behind.
      - uses: actions/upload-artifact@v4
        with:
          name: goodvoice-${{ github.ref_name }}-windows-x64
          path: artifacts/

      # A draft: the page it makes carries the installers and their checksums,
      # and a person writes what the release claims before anybody can download
      # it. 6.4 has things to say that CI cannot know — which measurements were
      # never taken, and on what hardware.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts | ForEach-Object FullName) `
            --draft --title "goodvoice ${{ github.ref_name }}" `
            --notes "Windows x64. Verify against ``SHA256SUMS.txt``. Built by CI from ${{ github.sha }}."
