[workspace]
members = ["."]
resolver = "2"

[package]
name = "goodvoice-client"
version = "0.1.0"
description = "goodvoice — lightweight voice chat for Windows gamers"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[lib]
# `_lib` suffix keeps the lib from colliding with the binary on Windows.
name = "goodvoice_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# styleguide.md: pedantic on at the crate root, no blanket allows. Declared here
# so binaries and tests inherit it too, not just `lib.rs`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `tray-icon`: the notification-area icon task 4.1 hides the window into.
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `opus` over `audiopus` — see DR-3 in .harness/plan.md. It pulls
# audiopus_sys 0.2, which vendors libopus and builds it with CMake, so no host
# needs a system libopus or libclang.
opus = "0.3"
# The transport to the Realtime SFU (DR-7). Pure Rust, so it builds and runs on
# the dev host as well as the Windows target. `rtc` is webrtc's own Sans-I/O
# core, pinned to the same version: the codec and media types live there and
# are only partly re-exported.
webrtc = "0.20"
rtc = "0.20"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# rustls only: a desktop client should not depend on whatever OpenSSL the host
# happens to ship.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# The roster arrives over a WebSocket, so the client needs a client-side one.
# Same rustls-only reasoning as reqwest.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Lock-free SPSC between the device callbacks and the codec tasks. Hand-rolling
# this is where real-time audio bugs come from (styleguide.md, Rust
# conventions).
ringbuf = "0.5"
# The audio device backend behind `audio::device`'s seam. Cross-platform, so
# the voice path can be exercised off Windows; whether it is also the Windows
# backend is task 2.1's measurement to make — see DR-8.
cpal = "0.18"
# Voice activity detection. `webrtc-audio-processing` was the PRD's pick, but
# its `voice_detected` stat is never populated in APM v2 — see DR-10. This is
# the standalone WebRTC VAD (libfvad), vendored C built with `cc`: no libclang,
# no meson, same profile as the vendored libopus DR-3 settled on.
webrtc-vad = "0.4"
anyhow = "1"

# Tests only. `#[tokio::test(start_paused = true)]` runs the clock instead of
# waiting on it, so a wait written in whole seconds — the ICE gathering ones in
# `rtc::session` — costs the suite nothing to assert on.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The 0.5 probe (what WASAPI will give us, which encoders are in silicon) and
# the global push-to-talk hook (task 4.3). Both are questions that only have
# meaning on Windows. Same major as the one tauri already pulls in, so it costs
# no extra build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
