[workspace]
members = [".", "harness"]
# The vendored `-sys` crate is a package, not a member: it is built through
# [patch.crates-io] below and has nothing to do with this workspace's builds.
exclude = ["vendor"]
resolver = "2"

[package]
name = "goodvoice-client"
version = "0.1.0"
description = "goodvoice — lightweight voice chat for Windows gamers"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false
# One binary lives here now — DR-29 moved the harnesses into their own package
# — so this is belt and braces. It is kept because of what happened when it was
# missing (DR-27): with twelve binaries in the package and nothing saying which
# was the app, `tauri build` shipped the alphabetically first one under the
# product's name. Anything that adds a second binary here should find this
# already answered.
default-run = "goodvoice-client"

[lib]
# `_lib` suffix keeps the lib from colliding with the binary on Windows.
name = "goodvoice_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# styleguide.md: pedantic on at the crate root, no blanket allows. On the
# workspace so the harness package is held to the same bar, and inherited here
# so binaries and tests get it too, not just `lib.rs`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[features]
# What tells `generate_context!` to embed `../dist` instead of pointing the
# webview at the Vite dev server. Off by default so `npm run tauri dev` still
# gets hot reload; the Tauri CLI turns it on for `tauri build`, and anything
# building a *release* binary by hand — the soak, the cold-start harness, the
# tray drills — has to turn it on too, or it measures a window showing
# "localhost refused to connect".
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `tray-icon`: the notification-area icon task 4.1 hides the window into.
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `opus` over `audiopus` — see DR-3 in .harness/plan.md. It pulls
# audiopus_sys 0.2, which vendors libopus and builds it with CMake, so no host
# needs a system libopus or libclang.
opus = "0.3"
# The transport to the Realtime SFU (DR-7). Pure Rust, so it builds and runs on
# the dev host as well as the Windows target. `rtc` is webrtc's own Sans-I/O
# core, pinned to the same version: the codec and media types live there and
# are only partly re-exported.
webrtc = "0.20"
rtc = "0.20"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# rustls only: a desktop client should not depend on whatever OpenSSL the host
# happens to ship.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# The roster arrives over a WebSocket, so the client needs a client-side one.
# Same rustls-only reasoning as reqwest.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Lock-free SPSC between the device callbacks and the codec tasks. Hand-rolling
# this is where real-time audio bugs come from (styleguide.md, Rust
# conventions).
ringbuf = "0.5"
# The audio device backend behind `audio::device`'s seam. Cross-platform, so
# the voice path can be exercised off Windows; whether it is also the Windows
# backend is task 2.1's measurement to make — see DR-8.
cpal = "0.18"
# Voice activity detection. `webrtc-audio-processing` was the PRD's pick, but
# its `voice_detected` stat is never populated in APM v2 — see DR-10. This is
# the standalone WebRTC VAD (libfvad), vendored C built with `cc`: no libclang,
# no meson, same profile as the vendored libopus DR-3 settled on.
webrtc-vad = "0.4"
# Echo cancellation, noise suppression and gain control (task 3.4). `bundled`
# builds the C++ from the vendored source rather than linking whatever the host
# packages, which is the only shape that ships in an installer. See DR-11.
webrtc-audio-processing = { version = "~2.1", features = ["bundled"] }
anyhow = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

# Tests only. `#[tokio::test(start_paused = true)]` runs the clock instead of
# waiting on it, so a wait written in whole seconds — the ICE gathering ones in
# `rtc::session` — costs the suite nothing to assert on.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The 0.5 probe (what WASAPI will give us, which encoders are in silicon), the
# global push-to-talk hook (task 4.3) and the idle soak's process-tree sampling
# (4.5). All questions that only have meaning on Windows. Same major as the one
# tauri already pulls in, so it costs no extra build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  # Screen capture (task 5.1). `Graphics_Capture` is the WinRT half —
  # the frame pool and the capture session — and the three `Win32_System_WinRT`
  # entries are the bridge back to the D3D11 device the frames actually live
  # on. Neither half is usable without the other.
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  # ICodecAPI takes its settings as VARIANTs, and a VARIANT is only a type
  # with this on (task 5.3: GOP size, and a keyframe on demand for 5.4).
  "Win32_System_Ole",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# What a crash report can be read with. On windows-msvc a PDB is written
# either way — the linker produces one whatever `debug` says — but the profile
# default of `debug = false` leaves it holding only what the *linker* knows:
# public symbols, no line numbers, and no record of what was inlined. With
# `lto = true` and `opt-level = "s"` above, almost every interesting frame is
# inlined, so that PDB symbolicates a minidump into a short list of the wrong
# functions.
#
# `line-tables-only` is the cheapest setting that adds the line tables and the
# inline records. Measured on `probe`, the smallest binary here, rebuilt
# either side of this line: PDB 1,019,904 -> 1,126,400 bytes (+10.4%), and the
# exe **byte-for-byte the same size** at 156,672. None of it ships: the PDB is
# a separate file that no installer carries.
#
# `strip = true` used to sit here and is deliberately gone. On MSVC it behaves
# as `strip = "symbols"`, which is what breaks a backtrace on this target —
# Cargo disables its own default debuginfo stripping here for that reason
# (rust-lang/cargo#13630) — and it was buying nothing, since the exe is the
# same size without it.
debug = "line-tables-only"

# DR-11: upstream's build.rs has no Windows branch and fails in five places,
# none of them a real incompatibility. `vendor/webrtc-audio-processing-sys`
# is 2.1.0 with those five fixed; DR-24 lists them one by one. Drop this
# table, and the directory with it, once a release carries them.
[patch.crates-io]
webrtc-audio-processing-sys = { path = "vendor/webrtc-audio-processing-sys" }
